<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>身份验证 | 网管移动终端</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
        }
        .glass {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">

    <div class="glass w-full max-w-sm p-8 rounded-3xl shadow-2xl text-white">
        <div class="text-center mb-8">
            <h2 class="text-2xl font-bold">系统准入验证</h2>
            <p class="text-slate-300 text-sm mt-2">请输入凭据以访问控制终端</p>
        </div>

        <form action="/login" method="post" class="space-y-6">
            <div>
                <label class="block text-sm font-medium mb-2">用户名</label>
                <input type="text" name="username" required 
                    class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
            </div>
            
            <div>
                <label class="block text-sm font-medium mb-2">密码</label>
                <input type="password" name="password" required 
                    class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
            </div>

            <button type="submit" 
                class="w-full py-3.5 bg-blue-600 hover:bg-blue-700 rounded-xl font-bold transition shadow-lg shadow-blue-500/30">
                登录进入系统
            </button>
        </form>
    </div>

</body>
</html>
